<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css"/>
    </head>
    <body>
        <header>
        <nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="accommodations.html">Accommodations & Travel</a></li>
                <li><a href="weekend.html">The Weekend</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="rsvp.html">RSVP</a></li>
            </ul>
        </nav>
        </header>
        <main>
            <section class="content-section">
            <h1>RSVP</h1>
                
            <!-- Status messages -->
            <div id="form-success" class="form-message form-success">
                Thank you — your RSVP has been submitted!
            </div>

            <div id="form-error" class="form-message form-error">
                Something went wrong. Please try again.
            </div>
                
            <form id="rsvp-form"
            class="rsvp-form card-section" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLScunKPAA7yLbM2eg4T4ZPe5K4PpKNCmXoLyGT0D1HLYQpLAlA/formResponse" method="POST" novalidate >

                <!-- Name -->
                <div class="form-row">
                    <label for="name">Full Name</label>
                    <input id="name" name="entry.165103644" type="text" placeholder="Jane Doe" required />
                </div>

                <!-- Email -->
                <div class="form-row">
                    <label for="email">Email Address</label>
                    <input id="email" name="emailAddress" type="email" placeholder="you@domain.com" required />
                </div>

                <!-- Can attend (radio) -->
                <div class="form-row">
                    <label>Can you attend?</label>
                    <div class="choice-row" role="radiogroup" aria-label="Can you attend">
                      <label class="radio">
                        <input type="radio" name="entry.877086558" value="Yes,  I'll be there" required> Yes
                      </label>
                      <label class="radio">
                        <input type="radio" name="entry.877086558" value="Sorry, can't make it"> No
                      </label>
                    </div>
                </div>
                
                <!-- Can attend welcome party (radio) -->
                <div class="form-row">
                    <label>Do you plan to attend the welcome party Sunday night?</label>
                    <div class="choice-row" role="radiogroup" aria-label="Can you attend wp">
                      <label class="radio">
                        <input type="radio" name="entry.897900313" value="Yes" required> Yes
                      </label>
                      <label class="radio">
                        <input type="radio" name="entry.897900313" value="No"> No
                      </label>
                    </div>
                </div>

                <!-- Number of guests (select) -->
                <div class="form-row">
                    <label for="guests">How many guests in your party?</label>
                    <select id="guests" name="entry.1527366280" required>
                      <option value="">Please select</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="3">4</option>
                      <option value="3">5</option>
                    </select>
                </div>

                <!-- Comments -->
                <div class="form-row">
                    <label for="comments">Comments or Questions</label>
                    <textarea id="comments" name="entry.2606285" placeholder="Let us know about any comments/questions/allergies you may have…" rows="4"></textarea>
                </div>

                <!-- Submit -->
                <div class="form-row form-actions">
                    <button type="submit" class="button rsvp-submit">Send RSVP</button>
                </div>
                
            </form>
                
            </section>
        </main>
        <footer>
          <p>© 2026 Karlee & Neil · Designed with love for our Charleston celebration</p>
        </footer>
        <script>
            const menu = document.getElementById('mobile-menu');
            const navLinks = document.querySelector('.nav-links');

            menu.addEventListener('click', () => {
            menu.classList.toggle('active');
            navLinks.classList.toggle('show');
            });
            
            //form submission
            document.getElementById("rsvp-form").addEventListener("submit", function (e) {
                e.preventDefault();

                const form = e.target;
                const formData = new FormData(form);
                const successMsg = document.getElementById("form-success");
                const errorMsg = document.getElementById("form-error");

                // Always hide messages before new submission
                successMsg.style.display = "none";
                errorMsg.style.display = "none";

                // Send to Google Forms — WILL succeed even though browser blocks response
                fetch("https://docs.google.com/forms/u/0/d/e/1FAIpQLScunKPAA7yLbM2eg4T4ZPe5K4PpKNCmXoLyGT0D1HLYQpLAlA/formResponse", {
                    method: "POST",
                    mode: "no-cors",
                    body: formData
                });

                // Show success message immediately
                successMsg.style.display = "block";

                // Optional: clear form
                form.reset();
            });
            
        </script>
    </body>
</html>
